name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Backend and frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:1/parkreserve

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Smoke test FastAPI app
        run: |
          PYTHONPATH=backend python -c "from app.main import app; assert app.title == 'ParkReserve AI'; print(app.title)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: frontend/dashboard
        run: npm run build
